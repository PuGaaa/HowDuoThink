name: ci
on:
  push:
    branches: [main]
  pull_request:
# 最小权限：gitleaks-action 在 PR 事件下需要列 PR commits（pull-requests: read），
# 缺省会 403 "Resource not accessible by integration"
permissions:
  contents: read
  pull-requests: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: hdt_ci
          MYSQL_USER: hdt_ci
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_PROVIDER: mysql
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-root-password
      MYSQL_DATABASE: hdt_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/requirements-dev.lock }
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/requirements-dev.lock }
      - run: pip install pip-audit && pip-audit -r server/requirements.lock

  admin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  app-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install app dependencies
        run: npm ci --prefix app
      - name: Install source-test compiler
        run: npm install --prefix "$RUNNER_TEMP/think-source-tests" --no-save --package-lock=false --ignore-scripts typescript@6.0.3
      - name: App and content regressions
        env:
          THINK_REVIEW_TYPESCRIPT: ${{ runner.temp }}/think-source-tests/node_modules/typescript
        run: node --test app/tests/*.test.mjs content/pipeline/*.test.mjs content/baselines/*.test.mjs
      - run: node content/pipeline/validate.mjs app/data/cases/first-npe.ts app/data/cases/caused-by.ts app/data/cases/log-correlation.ts app/data/cases/async-swallow.ts

  image-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api: ${{ steps.changes.outputs.api }}
      admin: ${{ steps.changes.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Detect independently deployable changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          echo "api=false" >> "$GITHUB_OUTPUT"
          echo "admin=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" != "push" || "$REF_NAME" != "refs/heads/main" ]]; then
            exit 0
          fi
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BEFORE_SHA=$(git rev-list --max-parents=0 "$HEAD_SHA")
          fi
          changed=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
          if grep -Eq '^(server/|app/data/cases/|content/tools/export-case\.mjs)' <<< "$changed"; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^admin/' <<< "$changed"; then
            echo "admin=true" >> "$GITHUB_OUTPUT"
          fi

  publish-api:
    if: needs.image-changes.outputs.api == 'true'
    needs: [image-changes, server, security, app-content]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Export reviewed official cases for the API image
        run: node content/tools/export-case.mjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/pugaaa/howduothink-api:main
            ghcr.io/pugaaa/howduothink-api:sha-${{ github.sha }}

  publish-admin:
    if: needs.image-changes.outputs.admin == 'true'
    needs: [image-changes, security, admin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish Admin image
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.ADMIN_SENTRY_DSN }}
            VITE_SENTRY_ENV=prod
          tags: |
            ghcr.io/pugaaa/howduothink-admin:main
            ghcr.io/pugaaa/howduothink-admin:sha-${{ github.sha }}
