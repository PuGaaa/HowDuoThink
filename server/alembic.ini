# Alembic 最小配置：不写 sqlalchemy.url——URL 由 alembic/env.py 运行时按
# DB_PROVIDER 组装（sqlite 读 core.db.DB_PATH，mysql 读 core.config 的 MYSQL_*），
# 测试靠 monkeypatch core.db.DB_PATH 切换隔离库，ini 里缓存 URL 会锁死路径。
# script_location 用 %(here)s（= 本 ini 所在目录）绝对化：alembic 对相对路径按
# 进程 cwd 解析，编程式入口（core/migrate.py）必须 cwd 无关。
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
