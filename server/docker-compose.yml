services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_PROVIDER: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306  # 容器内固定连 mysql:3306，覆盖 .env 的 MYSQL_PORT（其新语义=宿主机映射端口）
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8001"
    volumes:
      - fastembed-cache:/app/hdx/.fastembed

  backup:
    image: mysql:8.0
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_PWD=${MYSQL_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - BACKUP_DIR=/backups
      - BACKUP_INTERVAL_SECONDS=86400
      - BACKUP_RETENTION_DAYS=7
    entrypoint: ["bash", "/ops/backup/schedule.sh"]
    volumes:
      - backups:/backups
      - ./ops/backup:/ops/backup:ro
    healthcheck:
      test: ["CMD", "bash", "/ops/backup/health.sh"]
      interval: 5m
      timeout: 5s
      retries: 1
      start_period: 5m

volumes:
  mysql-data:
  fastembed-cache:
  backups:
