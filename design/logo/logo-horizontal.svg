<svg width="520" height="200" viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .outline { stroke:#37323F; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .shadow-block { fill:#FF8A5C; }
      .face { fill:#EFE5D6; }
      .coral-soft { fill:#FF8A5C; opacity:0.35; }
      .coral-ear { fill:#FF8A5C; opacity:0.6; }
      .ink { fill:#37323F; }
      .white { fill:#FFFFFF; }
      .brand-zh { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 56px; font-weight: 800; fill: #37323F; }
      .brand-en { font-family: "Nunito", -apple-system, sans-serif; font-size: 32px; font-weight: 700; fill: #FF8A5C; letter-spacing: 0.02em; }
    </style>
  </defs>

  <!-- MARK: 兽首积木 -->
  <g transform="translate(36,36)">
    <!-- 实体积木厚度底 -->
    <rect x="44" y="44" width="112" height="112" rx="40" class="shadow-block"/>
    <!-- 积木正面 -->
    <rect x="36" y="36" width="112" height="112" rx="40" class="face outline"/>
    <!-- 耳朵 -->
    <circle cx="56" cy="20" r="18" class="face outline"/>
    <circle cx="56" cy="20" r="9" class="coral-ear"/>
    <circle cx="144" cy="20" r="18" class="face outline"/>
    <circle cx="144" cy="20" r="9" class="coral-ear"/>
    <!-- 眼睛 -->
    <ellipse cx="66" cy="64" rx="15" ry="19" class="white outline"/>
    <circle cx="68" cy="72" r="8" class="ink"/>
    <circle cx="72" cy="66" r="4" class="white"/>
    <ellipse cx="134" cy="64" rx="15" ry="19" class="white outline"/>
    <circle cx="132" cy="72" r="8" class="ink"/>
    <circle cx="136" cy="66" r="4" class="white"/>
    <!-- 腮红 -->
    <ellipse cx="54" cy="106" rx="10" ry="6" class="coral-soft"/>
    <ellipse cx="146" cy="106" rx="10" ry="6" class="coral-soft"/>
    <!-- 嘴 -->
    <path d="M 84,118 Q 100,128 116,118" fill="none" class="ink" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- WORDMARK: 字标 -->
  <text x="220" y="116" class="brand-zh">稳住</text>
  <text x="224" y="158" class="brand-en">Steady</text>
</svg>
